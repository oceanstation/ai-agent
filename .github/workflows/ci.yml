name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  affected:
    name: Nx Affected (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NX_CLOUD_DISTRIBUTED_EXECUTION: "false"
      NX_BRANCH: ${{ github.event.number || github.ref_name }}
      NX_RUN_GROUP: ${{ github.run_id }}

    steps:
      - name: Checkout (full history for nx affected)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive Nx SHAs (base / head)
        uses: nrwl/nx-set-shas@v4

      # 打印本次将要处理的项目，便于排查
      - name: Print affected projects
        run: pnpm exec nx show projects --affected

      - name: Lint (affected)
        run: pnpm exec nx affected -t lint --parallel=3

      - name: Typecheck (affected)
        run: pnpm exec nx affected -t typecheck --parallel=3

      - name: Test (affected)
        run: pnpm exec nx affected -t test --parallel=3 --configuration=ci

      - name: Build (affected)
        run: pnpm exec nx affected -t build --parallel=3

      # 缓存 .nx 本地缓存，跨 job 复用（Nx Cloud 未接入时的临时方案）
      - name: Cache Nx local cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nx-cache-${{ runner.os }}-
